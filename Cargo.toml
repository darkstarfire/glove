[workspace]
resolver = "2"
members = ["crates/compositor", "crates/power", "crates/about", "crates/prefs", "crates/calc", "crates/clock", "crates/editor", "crates/files", "crates/viewer", "crates/term", "crates/notes", "crates/monitor", "crates/shot", "crates/recorder", "crates/screenrec","crates/chars", "crates/find", "crates/disks", "crates/chess", "crates/logout", "crates/login", "crates/art", "crates/welcome", "crates/archive", "crates/browser", "crates/music", "crates/contacts", "crates/calendar", "crates/video", "crates/console", "crates/info", "crates/help", "crates/dictionary", "crates/fonts", "crates/mail", "crates/portal", "crates/keychain", "crates/netutil", "crates/backup", "crates/appcenter", "crates/voicerec", "crates/photos", "crates/messages", "crates/installer", "crates/auth", "crates/apps"]

[workspace.package]
version = "0.15.22"
edition = "2024"
# O mínimo que as dependências pedem (uuid 1.29). Compilar com um Rust mais velho
# dá um erro claro do Cargo, em vez de erros de compilação.
rust-version = "1.89"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Mantém o modo debug rápido o suficiente para testar
[profile.dev.package."*"]
opt-level = 2
