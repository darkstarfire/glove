[workspace]
resolver = "2"
members = ["crates/compositor", "crates/about", "crates/prefs", "crates/calc", "crates/clock", "crates/editor", "crates/files", "crates/viewer", "crates/term", "crates/notes", "crates/monitor", "crates/shot", "crates/chars", "crates/find", "crates/disks", "crates/chess", "crates/sair", "crates/login", "crates/arte", "crates/boasvindas", "crates/arquivo", "crates/navegador", "crates/musica", "crates/contatos", "crates/agenda", "crates/video", "crates/registros", "crates/info", "crates/ajuda", "crates/dicionario", "crates/fontes", "crates/correio", "crates/portal", "crates/chaves", "crates/utilrede", "crates/apps"]

[workspace.package]
version = "0.10.5"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Mantém o modo debug rápido o suficiente para testar
[profile.dev.package."*"]
opt-level = 2
