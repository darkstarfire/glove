theme = "claro"
wallpaper = "ondas"
terminal = "glove-term"
terminal_font = ""
terminal_font_size = 12.0
trash_command = "glove-files ~/.local/share/Trash/files"
dock_rev = 2

[dock]
size = 56
magnification = true
max_size = 80

[keyboard]
layout = "br"
variant = ""
repeat_delay = 300
repeat_rate = 30

[pointer]
natural_scroll = false
speed = 0.0
acceleration = true
left_handed = false

[touchpad]
tap_to_click = true
natural_scroll = true
speed = 0.0
disable_while_typing = true
two_finger_right_click = true

[monitor]
output = ""
mode = ""
scale = 0.0

[[shortcuts]]
action = "terminal"
keys = "Super+Return"

[[shortcuts]]
action = "close"
keys = "Super+Q"

[[shortcuts]]
action = "minimize"
keys = "Super+M"

[[shortcuts]]
action = "zoom"
keys = "Super+Up"

[[shortcuts]]
action = "cycle"
keys = "Super+Tab"

[[shortcuts]]
action = "preferences"
keys = "Super+Comma"

[[shortcuts]]
action = "screenshot"
keys = "Print"

[[shortcuts]]
action = "quit"
keys = "Ctrl+Alt+BackSpace"

[[dock_apps]]
name = "Arquivos"
icon = "folder"
command = "glove-files"
app_id = "glove.Files"

[[dock_apps]]
name = "Terminal"
icon = "terminal"
command = "glove-term"
app_id = "glove.Terminal"

[[dock_apps]]
name = "Navegador"
icon = "globe"
command = "mkdir -p ~/.cache/glove/firefox && firefox --no-remote --profile ~/.cache/glove/firefox"
app_id = "firefox"

[[dock_apps]]
name = "Editor de Texto"
icon = "editor"
command = "glove-edit"
app_id = "glove.TextEditor"

[[dock_apps]]
name = "Lembretes"
icon = "notes"
command = "glove-notes"
app_id = "glove.Notes"

[[dock_apps]]
name = "Calculadora"
icon = "calculator"
command = "glove-calc"
app_id = "glove.Calculator"

[[dock_apps]]
name = "Relógio"
icon = "clock"
command = "glove-clock"
app_id = "glove.Clock"

[[dock_apps]]
name = "Visualizador"
icon = "picture"
command = "glove-view"
app_id = "glove.Viewer"

[[dock_apps]]
name = "Busca"
icon = "search"
command = "glove-find"
app_id = "glove.Find"

[[dock_apps]]
name = "Caracteres"
icon = "chars"
command = "glove-chars"
app_id = "glove.Chars"

[[dock_apps]]
name = "Captura"
icon = "camera"
command = "glove-shot"
app_id = "glove.Shot"

[[dock_apps]]
name = "Monitor"
icon = "monitor"
command = "glove-monitor"
app_id = "glove.Monitor"

[[dock_apps]]
name = "Discos"
icon = "disk"
command = "glove-disks"
app_id = "glove.Disks"

[[dock_apps]]
name = "Xadrez"
icon = "chess"
command = "glove-chess"
app_id = "glove.Chess"

[[dock_apps]]
name = "Preferências"
icon = "settings"
command = "glove-prefs"
app_id = "glove.Preferences"
