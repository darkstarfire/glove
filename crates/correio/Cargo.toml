[package]
name = "glove-correio"
# Vira biblioteca: o executável é o glove-apps (um só para todos os apps).
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/main.rs"

[dependencies]
glove-kit = { path = "../kit" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
