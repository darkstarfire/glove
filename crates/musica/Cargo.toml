[package]
name = "glove-musica"
# Vira biblioteca: o executável é o glove-apps (um só para todos os apps).
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/main.rs"

[dependencies]
glove-kit = { path = "../kit" }
glove-config = { path = "../config" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4"] }
