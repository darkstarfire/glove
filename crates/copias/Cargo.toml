[package]
name = "glove-copias"
# Vira biblioteca: o executável é o glove-apps (um só para todos os apps).
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/main.rs"

[dependencies]
glove-config = { path = "../../ui/crates/config" }
glove-ui = { path = "../../ui/crates/ui" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
