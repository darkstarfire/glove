[package]
name = "glove"
version.workspace = true
edition.workspace = true

[dependencies]
bitflags = "2"
glove-config = { path = "../config" }
glove-paint = { path = "../paint" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "renderer_gl", "backend_egl", "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "xwayland"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
