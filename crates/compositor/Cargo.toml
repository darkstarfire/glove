[package]
name = "glove"
version.workspace = true
edition.workspace = true

[features]
# Conta as alocações do Rust (só para medir memória; deixa o Glove um pouco mais lento).
memstats = []

[dependencies]
bitflags = "2"
glove-config = { path = "../../ui/crates/config" }
glove-energia = { path = "../energia" }
glove-paint = { path = "../../ui/crates/paint" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "renderer_gl", "backend_egl", "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "xwayland"] }
toml = "1.1.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
