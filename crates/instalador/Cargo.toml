[package]
name = "glove-instalador"
# Vira biblioteca: o executável é o glove-apps (um só para todos os apps).
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/main.rs"

[dependencies]
glove-config = { path = "../../ui/crates/config" }
glove-ui = { path = "../../ui/crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
