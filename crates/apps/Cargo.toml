[package]
name = "glove-apps"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# Um executável só para todos os apps do Glove (como o BusyBox): glove-files,
# glove-prefs e os outros são atalhos para ele, e ele abre o app pelo nome com
# que foi chamado. Cada app continua um processo separado, mas o código fica
# uma vez só na memória (as páginas do executável são divididas entre eles) e
# no disco.

[dependencies]
glove-about = { path = "../about" }
glove-agenda = { path = "../agenda" }
