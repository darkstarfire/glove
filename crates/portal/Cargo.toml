[package]
name = "glove-portal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glove-config = { path = "../../ui/crates/config" }
glove-ui = { path = "../../ui/crates/ui" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[[bin]]
name = "glove-portal"
path = "src/main.rs"

[[bin]]
name = "glove-escolher"
path = "src/bin/escolher.rs"
