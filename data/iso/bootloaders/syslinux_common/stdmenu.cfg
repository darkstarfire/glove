# Glove OS live boot menu (BIOS, syslinux, 640x480 = 80x30 characters). Replaces
# live-build's layout: the background is the Glove OS wallpaper (splash.png), so the
# menu sits at the bottom, below the glove and the name, and has no title.
menu background splash.png
menu color title	* #00000000 #00000000 none
menu color border	* #00000000 #00000000 none
menu color unsel	* #ffffffff #00000000 none
menu color sel		* #ff10306a #e0ffffff none
menu color hotkey	* #ffffffff #00000000 none
menu color hotsel	* #ff10306a #e0ffffff none
menu color tabmsg	* #ffffffff #00000000 none
menu color cmdline	* #ffffffff #00000000 none
menu color timeout_msg	* #ffffffff #00000000 none
menu color timeout	* #ffffffff #00000000 none
menu color help		37;40 #ffdddd00 #00000000 none
menu width 44
menu margin 2
menu hshift 18
menu vshift 21
menu rows 3
# The rows below count from "menu vshift". The command line must be at least one
# line from the bottom.
menu helpmsgrow 7
menu cmdlinerow 7
menu timeoutrow 7
menu tabmsgrow 8
menu tabmsg Press ENTER to boot or TAB to edit a menu entry
