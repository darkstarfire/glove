# Glove OS: nome no menu do GRUB. (O grub-install usa a primeira palavra em
# minúsculas, "glove", como pasta na partição EFI: a mesma do instalador.)
GRUB_DISTRIBUTOR="Glove OS"
# Fundo do menu: o papel de parede do Glove OS (vem no pacote glove). As cores
# do texto estão em /etc/grub.d/06_glove.
GRUB_BACKGROUND="/usr/share/glove/papeis/glove-os.png"
# Tela de início do sistema (Plymouth, com o tema do Glove) no lugar do texto do boot.
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
    *" splash "* | *" nosplash "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
