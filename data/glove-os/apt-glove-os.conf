// Glove OS: depois de cada instalação, a identidade acompanha a do Debian.
DPkg::Post-Invoke { "if [ -x /usr/share/glove-os/identidade ]; then /usr/share/glove-os/identidade || true; fi"; };
// Glove OS: o apt-daily do Debian renova a lista de pacotes todo dia (sem instalar
// nada). Assim o Glove sabe, sem pedir senha, que há atualizações e avisa.
APT::Periodic::Update-Package-Lists "1";
