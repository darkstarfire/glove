// Glove OS: after every install, the identity follows Debian's.
DPkg::Post-Invoke { "if [ -x /usr/share/glove-os/identity ]; then /usr/share/glove-os/identity || true; fi"; };
// Glove OS: Debian's apt-daily refreshes the package list every day (without installing
// anything). That way Glove knows, without asking for a password, that there are updates
// and tells the user.
APT::Periodic::Update-Package-Lists "1";
