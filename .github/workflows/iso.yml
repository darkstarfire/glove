# A cada tag de versão (v0.12.37…): os pacotes .deb, o repositório apt do Glove OS
# (GitHub Pages, assinado) e a ISO, publicados na release da versão. Nessa ordem: a
# ISO já traz o repositório configurado (pacote glove-os), e o apt da montagem lê o
# repositório, que então precisa estar no ar. Em paralelo, os pacotes para Fedora, Arch
# e Slackware (pacotes-distros.yml), que vão para a mesma release.
# Também pode ser rodado à mão (Actions → ISO do Glove OS → Run workflow): os arquivos
# ficam como artefatos da execução, sem release nem repositório.
name: ISO do Glove OS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Os pacotes glove e glove-os, compilados no Debian trixie (a base da ISO).
  pacotes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Conferir a versão com a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Cargo.toml diz $v, mas a tag é $GITHUB_REF_NAME"; exit 1; }

      - name: Compilar e empacotar (Debian trixie)
        run: docker run --rm -v "$PWD:/src" -w /src debian:trixie sh ci/pacotes.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: pacotes/*.deb
          retention-days: 7

  # 2. O repositório apt (atualizações do glove e do glove-os sem esperar o Debian):
  # assinado com o segredo APT_SIGNING_KEY e publicado no GitHub Pages. Sem o segredo
  # (ou sem o Pages), não publica; a ISO sai do mesmo jeito.
  repositorio:
    needs: pacotes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Conferir a chave
        id: chave
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Sem o segredo APT_SIGNING_KEY: o repositório apt não é publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          name: pacotes
          path: pacotes

      - name: Montar o repositório
        if: steps.chave.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends apt-utils gnupg jq >/dev/null
          export GNUPGHOME="$(mktemp -d)"
          echo "$KEY" | gpg --batch --import
          r=site
          mkdir -p $r/pool/main $r/dists/glove/main/binary-amd64
          cp pacotes/*.deb $r/pool/main/
          (cd $r && apt-ftparchive packages pool > dists/glove/main/binary-amd64/Packages)
          gzip -9kn $r/dists/glove/main/binary-amd64/Packages
          (cd $r/dists/glove && apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Glove OS" \
            -o APT::FTPArchive::Release::Label="Glove OS" \
            -o APT::FTPArchive::Release::Suite=glove \
            -o APT::FTPArchive::Release::Codename=glove \
            -o APT::FTPArchive::Release::Architectures="amd64 all" \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="Glove OS: o Glove e a identidade do Glove OS (o Debian vem do Debian)" \
            release . > Release)
          gpg --batch --yes --clearsign -o $r/dists/glove/InRelease $r/dists/glove/Release
          gpg --batch --yes -abs -o $r/dists/glove/Release.gpg $r/dists/glove/Release
          cp data/glove-os/glove-os-repositorio.asc data/glove-os/glove-os-repositorio.gpg $r/
          # O que há de novo (lido pelo painel Atualização de Software do Glove).
          v=${GITHUB_REF_NAME#v}
          notas=$(git log -1 --format=%B | grep -v '^Co-Authored-By:' || true)
          jq -n --arg v "$v" --arg d "$(date -u +%Y-%m-%d)" --arg n "$notas" '{versao:$v, data:$d, notas:$n}' > $r/novidades.json
          cat > $r/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>Glove OS — repositório apt</title>
          <h1>Glove OS — repositório apt</h1>
          <p>Versão $v. O Glove OS já vem com este repositório; para usar o Glove noutro Debian ou Ubuntu:</p>
          <pre>sudo curl -fsSL https://fabioaacarneiro.github.io/glove/glove-os-repositorio.gpg -o /usr/share/keyrings/glove-os-repositorio.gpg
          printf 'Types: deb\\nURIs: https://fabioaacarneiro.github.io/glove\\nSuites: glove\\nComponents: main\\nSigned-By: /usr/share/keyrings/glove-os-repositorio.gpg\\n' | sudo tee /etc/apt/sources.list.d/glove-os.sources
          sudo apt update && sudo apt install glove</pre>
          EOF
          find $r -type f | sort

      - uses: actions/upload-pages-artifact@v3
        if: steps.chave.outputs.ok == 'true'
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deploy
        if: steps.chave.outputs.ok == 'true'
        uses: actions/deploy-pages@v4

  # 3. A ISO, com os pacotes do passo 1 (sem compilar de novo).
  iso:
    needs: [pacotes, repositorio]
    if: ${{ always() && needs.pacotes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: pacotes
          path: pacotes

      # O repositório do Glove no ar? Se não (fork sem a chave, Pages desligado), a ISO
      # sai sem ele configurado, em vez de o apt da montagem parar no erro.
      - name: Conferir o repositório do Glove
        id: repo
        run: |
          if curl -fsS --max-time 20 https://fabioaacarneiro.github.io/glove/dists/glove/InRelease >/dev/null; then
            echo "sem=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Repositório do Glove fora do ar: a ISO sai sem ele."
            echo "sem=1" >> "$GITHUB_OUTPUT"
          fi

      # Inside Debian trixie (the ISO's base) and privileged (live-build mounts /proc
      # and /dev in the image's chroot).
      - name: Montar a ISO (Debian trixie)
        run: docker run --rm --privileged -e GLOVE_USAR_PACOTES=1 -e GLOVE_SEM_REPOSITORIO=${{ steps.repo.outputs.sem }} -v "$PWD:/src" -w /src debian:trixie sh ci/iso.sh

      - name: Preparar os arquivos
        run: |
          sudo chown -R "$(id -u):$(id -g)" iso pacotes
          mkdir saida
          mv iso/glove-os-*-amd64.iso pacotes/*.deb saida/
          cd saida
          # Release assets are limited to 2 GiB each: split a bigger ISO in parts.
          for f in *.iso; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              sha256sum "$f" > "$f.sha256"
              split -b 1900M -d "$f" "$f.part"
              rm "$f"
            fi
          done
          sha256sum * | grep -v '\.sha256$' > SHA256SUMS
          ls -lh

      - name: Guardar como artefato (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: glove-os
          path: saida/
          retention-days: 7

      - name: Publicar na release da versão
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh ci/release.sh "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" saida/* --clobber

  # 4. Os pacotes das outras distribuições (Fedora, Arch e Slackware), cada um compilado
  # na própria distribuição, em paralelo com o resto.
  distros:
    uses: ./.github/workflows/pacotes-distros.yml

  # 5. Esses pacotes na release da versão, somados ao SHA256SUMS. Uma distribuição que
  # falhou fica de fora (a execução aparece como falha), e as outras saem assim mesmo.
  publicar-distros:
    needs: [iso, distros]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pacote-*
          path: distros
          merge-multiple: true

      - name: Publicar na release da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls distros/* >/dev/null 2>&1; then
            echo "::warning::Nenhum pacote das outras distribuições foi gerado."
            exit 0
          fi
          tag=$GITHUB_REF_NAME
          sh ci/release.sh "$tag"
          # Soma as somas destes arquivos às que a ISO publicou.
          gh release download "$tag" -p SHA256SUMS -O SHA256SUMS 2>/dev/null || : > SHA256SUMS
          (cd distros && sha256sum *) >> SHA256SUMS
          # Um arquivo só uma vez (a última soma vale, se a execução foi repetida).
          tac SHA256SUMS | awk '!visto[$2]++' | tac > somas && mv somas SHA256SUMS
          gh release upload "$tag" distros/* SHA256SUMS --clobber
          cat SHA256SUMS
